name: Validar portal

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Executar testes
        run: npm test -- --run
      - name: Gerar build
        run: npm run build
